<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background with subtle gradient & rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#090D16"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="32" cy="32" r="20" fill="#06B6D4" opacity="0.18" filter="blur(8px)"/>

  <!-- Applied Signal / Pipeline Beacon Waves -->
  <!-- Center Core -->
  <circle cx="32" cy="32" r="4" fill="#22D3EE"/>
  
  <!-- Wave 1 (inner) -->
  <path d="M24 24 A 11.3 11.3 0 0 0 24 40" stroke="#06B6D4" stroke-width="2.75" stroke-linecap="round"/>
  <path d="M40 24 A 11.3 11.3 0 0 1 40 40" stroke="#06B6D4" stroke-width="2.75" stroke-linecap="round"/>

  <!-- Wave 2 (outer) -->
  <path d="M18 18 A 19.8 19.8 0 0 0 18 46" stroke="#38BDF8" stroke-width="2.75" stroke-linecap="round" opacity="0.75"/>
  <path d="M46 18 A 19.8 19.8 0 0 1 46 46" stroke="#38BDF8" stroke-width="2.75" stroke-linecap="round" opacity="0.75"/>

  <!-- Top accent indicator -->
  <circle cx="32" cy="13" r="1.75" fill="#38BDF8" opacity="0.9"/>
</svg>
